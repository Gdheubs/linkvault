# Render blueprint. Import this repo at dashboard.render.com/blueprints.
#
# DEMO CONFIGURATION: this free-tier variant intentionally has no persistent
# disk because Render requires billing details before provisioning a paid disk.
# The app will boot, but the SQLite database is ephemeral: accounts, links,
# balances and file metadata can be lost after a restart or redeploy. For a
# real deployment, restore `plan: starter` and the disk block below.
services:
  - type: web
    name: linkvault
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz

    # SQLite tolerates exactly one writer. Never scale this above 1.
    numInstances: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_FILE
        value: /app/data/linkvault.db

      # Generated once by Render and then held stable across deploys.
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: HASH_SALT
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      # Fill these in from the dashboard.
      - key: BRAND_NAME
        value: LinkVault
      - key: SUPPORT_EMAIL
        sync: false
      - key: DMCA_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
